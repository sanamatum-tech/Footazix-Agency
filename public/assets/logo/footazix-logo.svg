<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 180" width="620" height="180" fill="none">
  <defs>
    <!-- 3D Bevel, Specular Highlight & Soft Shadow Filter -->
    <filter id="chroma-emboss" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-1" dy="-1.5" stdDeviation="0.7" flood-color="#ffffff" flood-opacity="0.95" result="specular"/>
      <feDropShadow dx="2" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.75" result="shadow"/>
      <feDropShadow dx="0.5" dy="1" stdDeviation="1" flood-color="#38bdf8" flood-opacity="0.35" result="prism"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="prism"/>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="specular"/>
      </feMerge>
    </filter>

    <linearGradient id="white-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="85%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <linearGradient id="edge-highlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="30%" stop-color="#E2E8F0" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#94A3B8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#475569" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Official Footazix Mark (Left) -->
  <g filter="url(#chroma-emboss)" transform="translate(10, 8) scale(0.33)">
    <!-- Top Blade (Sweeps up to apex) -->
    <path d="M 148 268 C 130 220 144 165 186 124 C 228 83 286 58 350 34 L 476 -14 C 486 -18 494 -8 488 2 L 456 68 C 450 80 440 88 428 93 L 322 140 C 256 168 220 208 210 252 C 196 240 174 234 154 240 C 148 244 142 252 148 268 Z"
          fill="url(#white-metal)" stroke="url(#edge-highlight)" stroke-width="3" stroke-linejoin="round"/>

    <!-- Middle Blade (Curved body of 'F' + upper arm) -->
    <path d="M 148 395 C 130 350 144 298 186 258 C 228 218 286 194 350 172 L 476 126 C 486 122 494 132 488 142 L 456 208 C 450 220 440 228 428 233 L 322 280 C 256 308 220 348 210 392 C 196 380 174 372 154 378 C 148 382 142 388 148 395 Z"
          fill="url(#white-metal)" stroke="url(#edge-highlight)" stroke-width="3" stroke-linejoin="round"/>

    <!-- Bottom Playhead Triangle -->
    <path d="M 268 395 L 438 305 C 450 298 464 308 460 322 L 430 422 C 424 436 408 442 396 435 L 262 368 C 250 360 254 345 268 395 Z"
          fill="url(#white-metal)" stroke="url(#edge-highlight)" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark 'Footazix' -->
  <g filter="url(#chroma-emboss)">
    <text x="195" y="98" 
          fill="url(#white-metal)" 
          stroke="url(#edge-highlight)" 
          stroke-width="1.2"
          font-family="'Manrope', 'Montserrat', 'Inter', sans-serif" 
          font-size="82" 
          font-weight="800" 
          letter-spacing="-0.025em">Footazix</text>

    <!-- Subtitle 'CREATIVE AGENCY' -->
    <text x="198" y="136" 
          fill="url(#white-metal)" 
          stroke="url(#edge-highlight)" 
          stroke-width="0.6"
          font-family="'Manrope', 'Montserrat', 'Inter', sans-serif" 
          font-size="21" 
          font-weight="700" 
          letter-spacing="0.34em">CREATIVE AGENCY</text>
  </g>
</svg>